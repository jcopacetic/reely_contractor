# Local dev infra for the Contractor node: Postgres (the `contractor` DB) + Redis.
# `pnpm infra:up` then `pnpm --filter @contractor/db migrate && … rls && … seed`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contractor
    ports:
      - "5436:5432"
    volumes:
      - contractor_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6383:6379"
volumes:
  contractor_pg:
